# Root sampling config. Contains ONLY generate_content_config fields.
#
# Token budget: one 32k window is shared by system + task + history + thinking
# + output. max_output_tokens 8192 leaves ~24k for the rest, and history is
# auto-compacted near 14336 tokens, so per-turn output is deliberately bounded
# rather than maxed. thinking_budget 4096 is enough for a few sentences of
# planning per turn without crowding the window or the visible tool call.
temperature: 0.2
top_p: 0.95
top_k: 40
max_output_tokens: 8192
presence_penalty: 0.0
frequency_penalty: 0.0
stop_sequences: []
response_mime_type: text/plain
seed: 0
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
